<div class="h-100" #canvas style="overflow: hidden"></div>

@if (projectService.project) {
<!-- what the preview is showing right now. Click it to switch between the selected
     scenes and the preset which is currently being edited. -->
<a
  href="#"
  class="preview-target"
  popover="{{ 'designer.preview.switch' | translate }}"
  container="body"
  placement="bottom"
  triggers="mouseenter:mouseleave"
  (click)="switchPreviewPreset(); (false)"
>
  <i
    class="fa fa-fw"
    [class.fa-file-o]="projectService.project.previewPreset"
    [class.fa-folder-open-o]="!projectService.project.previewPreset"
    aria-hidden="true"
  ></i>
  <span class="preview-target-type">{{
    (projectService.project.previewPreset ? 'designer.preview.preset' : 'designer.preview.scene') | translate
  }}</span>
  <span class="preview-target-name">{{ previewName() }}</span>
</a>
}
