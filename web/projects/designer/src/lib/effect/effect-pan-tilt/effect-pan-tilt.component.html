@if (effect) {
<div class="d-flex pan-tilt-effect">
  <svg class="pan-tilt-grid" [attr.viewBox]="'0 0 ' + gridSize + ' ' + gridSize">
    <line class="pan-tilt-grid-axis" [attr.x1]="gridSize / 2" y1="0" [attr.x2]="gridSize / 2" [attr.y2]="gridSize"></line>
    <line class="pan-tilt-grid-axis" x1="0" [attr.y1]="gridSize / 2" [attr.x2]="gridSize" [attr.y2]="gridSize / 2"></line>
    <path class="pan-tilt-grid-shape" [attr.d]="getShapePath()"></path>
  </svg>

  <div class="d-flex pan-tilt-effect-fields">
    <div class="btn-group btn-group-sm" role="group">
      @for (shape of shapes; track shape) {
      <button
        type="button"
        class="btn btn-secondary"
        [name]="'shape-' + shape"
        [class.active]="effect.shape === shape"
        (click)="setShape(shape)"
      >
        {{ 'designer.effect.pan-tilt-shape-' + shape | translate }}
      </button>
      }
    </div>

    <label class="pan-tilt-effect-field">
      <span>{{ 'designer.effect.pan-tilt-size' | translate }} {{ 'designer.fixtureCapabilityType.Pan' | translate }} °</span>
      <input class="sd-value-input" type="text" name="sizePan" [ngModel]="effect.sizePanDegrees" (ngModelChange)="setSizePan($event)" />
    </label>
    <label class="pan-tilt-effect-field">
      <span>{{ 'designer.effect.pan-tilt-size' | translate }} {{ 'designer.fixtureCapabilityType.Tilt' | translate }} °</span>
      <input class="sd-value-input" type="text" name="sizeTilt" [ngModel]="effect.sizeTiltDegrees" (ngModelChange)="setSizeTilt($event)" />
    </label>

    <label class="pan-tilt-effect-field">
      <span>{{ 'designer.effect.curve-length' | translate }}</span>
      <span class="d-flex">
        <input class="sd-value-input" type="text" name="length" [ngModel]="getLength()" (ngModelChange)="setLength($event)" />
        <select class="ml-1" name="lengthMode" [ngModel]="effect.lengthMode" (ngModelChange)="setLengthMode($event)">
          <option [value]="'millis'">s</option>
          <option [value]="'beats'">{{ 'designer.effect.pan-tilt-beats' | translate }}</option>
        </select>
      </span>
    </label>

    <label class="pan-tilt-effect-field" [title]="'designer.effect.pan-tilt-chase-hint' | translate">
      <span>{{ 'designer.effect.curve-chase' | translate }}</span>
      <input class="sd-value-input" type="text" name="chase" [ngModel]="getChase()" (ngModelChange)="setChase($event)" />
    </label>

    <label class="pan-tilt-effect-field" [title]="'designer.effect.pan-tilt-run-hint' | translate">
      <span>{{ 'designer.effect.curve-run-cycles' | translate }}</span>
      <input class="sd-value-input" type="text" name="runCycles" [ngModel]="getRunCycles()" (ngModelChange)="setRunCycles($event)" />
    </label>

    @if (effect.runMode === 'cycles') {
    <select name="endMode" [ngModel]="effect.endMode" (ngModelChange)="setEndMode($event)">
      <option [value]="'hold'">{{ 'designer.effect.curve-end-hold' | translate }}</option>
      <option [value]="'base'">{{ 'designer.effect.curve-end-base' | translate }}</option>
    </select>
    }
  </div>
</div>
}
