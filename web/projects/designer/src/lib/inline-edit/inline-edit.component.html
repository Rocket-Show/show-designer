<div class="inline-edit d-inline-flex align-items-center">
  @if (!editing) {
  <!-- Display mode: show the value and a pencil to start editing -->
  @if (value) {
  <span class="inline-edit-value">{{ value }}</span>
  } @else {
  <span class="inline-edit-value inline-edit-placeholder">{{ placeholder }}</span>
  }
  <a
    class="inline-edit-btn ml-2"
    href="#"
    (click)="startEdit(); (false)"
    popover="{{ 'designer.misc.edit' | translate }}"
    container="body"
    placement="bottom"
    triggers="mouseenter:mouseleave"
  >
    <i class="fa fa-pencil" aria-hidden="true"></i>
  </a>
  } @else {
  <!-- Edit mode: text field with accept and cancel buttons -->
  <input
    #editInput
    type="text"
    class="inline-edit-input"
    [placeholder]="placeholder"
    [ngModel]="editValue"
    (ngModelChange)="editValue = $event"
    (keydown.enter)="accept()"
    (keydown.escape)="cancel()"
  />
  <a
    class="inline-edit-btn inline-edit-accept ml-2"
    href="#"
    (click)="accept(); (false)"
    [attr.aria-label]="'designer.misc.ok' | translate"
  >
    <i class="fa fa-check" aria-hidden="true"></i>
  </a>
  <a
    class="inline-edit-btn inline-edit-cancel ml-1"
    href="#"
    (click)="cancel(); (false)"
    [attr.aria-label]="'designer.misc.cancel' | translate"
  >
    <i class="fa fa-times" aria-hidden="true"></i>
  </a>
  }
</div>
