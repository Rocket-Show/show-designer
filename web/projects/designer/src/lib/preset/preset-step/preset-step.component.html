@if (presetService.stepRailVisible && presetService.selectedPreset && presetService.selectedStep) {
<div class="step-rail d-flex flex-column h-100">
  <!-- what the sequence as a whole does -->
  <div class="step-rail-actions d-flex">
    <a
      href="#"
      class="btn btn-secondary"
      [class.text-primary]="presetService.stepPreviewRunning"
      popover="{{ 'designer.preset.steps-run' | translate }}"
      container="body"
      placement="left"
      triggers="mouseenter:mouseleave"
      (click)="switchStepPreview(); (false)"
      ><i
        class="fa fa-fw"
        [class.fa-play]="!presetService.stepPreviewRunning"
        [class.fa-pause]="presetService.stepPreviewRunning"
        aria-hidden="true"
      ></i
    ></a>
    <a
      href="#"
      class="btn btn-secondary"
      [class.text-primary]="presetService.selectedPreset.stepsLoop"
      popover="{{ 'designer.preset.steps-loop' | translate }}"
      container="body"
      placement="left"
      triggers="mouseenter:mouseleave"
      (click)="switchLoop(); (false)"
      ><i class="fa fa-repeat fa-fw" aria-hidden="true"></i
    ></a>
  </div>

  <!-- the states this preset runs through, in the order they are reached. The
       capability, channel and effect panels edit the selected one, and the one the
       preset is on while it runs is marked along its edge. -->
  <div class="steps flex-grow-1">
    @for (step of presetService.selectedPreset.steps; track step.uuid; let i = $index) {
    <div
      class="step"
      [class.step-selected]="step === presetService.selectedStep"
      [class.step-active]="step === activeStep"
      popover="{{ stepDescription(step, i) }}"
      container="body"
      placement="left"
      triggers="mouseenter:mouseleave"
      (click)="selectStep(step)"
      (dblclick)="openSettings(step)"
    >
      {{ i + 1 }}
    </div>
    }
  </div>

  <!-- what the steps themselves can be done with -->
  <div class="step-rail-actions d-flex">
    <a
      href="#"
      class="btn btn-secondary"
      popover="{{ 'designer.preset.step-add' | translate }}"
      container="body"
      placement="left"
      triggers="mouseenter:mouseleave"
      (click)="addStep(); (false)"
      ><i class="fa fa-plus fa-fw" aria-hidden="true"></i
    ></a>
    <a
      href="#"
      class="btn btn-secondary"
      [class.disabled]="presetService.selectedPreset.steps.length < 2"
      popover="{{ 'designer.preset.step-remove' | translate }}"
      container="body"
      placement="left"
      triggers="mouseenter:mouseleave"
      (click)="deleteStep(); (false)"
      ><i class="fa fa-trash-o fa-fw" aria-hidden="true"></i
    ></a>
    <a
      href="#"
      class="btn btn-secondary"
      popover="{{ 'designer.preset.step-settings' | translate }}"
      container="body"
      placement="left"
      triggers="mouseenter:mouseleave"
      (click)="openSettings(presetService.selectedStep); (false)"
      ><i class="fa fa-cog fa-fw" aria-hidden="true"></i
    ></a>
  </div>
</div>
}
