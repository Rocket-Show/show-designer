<div class="modal-header">
  <h4 class="modal-title pull-left">{{ name }}</h4>
  <button type="button" class="close pull-right" aria-label="Close" (click)="bsModalRef.hide()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="form-group row">
    <label class="col-lg-4 col-form-label">{{ 'designer.preset.settings-name' | translate }}</label>
    <div class="col-lg-7">
      <input type="text" class="form-control" [ngModel]="name" (ngModelChange)="name = $event" />
    </div>
  </div>

  <div class="form-group row">
    <label class="col-lg-4 col-form-label">{{ 'designer.preset.settings-start' | translate }}</label>
    <div class="col-lg-7">
      <input type="text" class="form-control" [ngModel]="startMillis" (ngModelChange)="startMillis = $event" />
    </div>
    <div class="col-lg-1 d-flex p-0">
      <div class="my-auto">
        {{ 'designer.misc.ms' | translate }}
      </div>
    </div>
  </div>

  <div class="form-group row">
    <label class="col-lg-4 col-form-label">{{ 'designer.preset.settings-end' | translate }}</label>
    <div class="col-lg-7">
      <input type="text" class="form-control" [ngModel]="endMillis" (ngModelChange)="endMillis = $event" />
    </div>
    <div class="col-lg-1 d-flex p-0">
      <div class="my-auto">
        {{ 'designer.misc.ms' | translate }}
      </div>
    </div>
  </div>

  <div class="form-group row">
    <label class="col-lg-4 col-form-label">{{ 'designer.preset.settings-fade-in' | translate }}</label>
    <div class="col-lg-7">
      <input type="text" class="form-control" [ngModel]="fadeInMillis" (ngModelChange)="fadeInMillis = $event" />
    </div>
    <div class="col-lg-1 d-flex p-0">
      <div class="my-auto">
        {{ 'designer.misc.ms' | translate }}
      </div>
    </div>
  </div>

  <div class="form-group row">
    <label class="col-lg-4 col-form-label">{{ 'designer.misc.transition-curve' | translate }}</label>
    <div class="col-lg-7">
      <select class="form-control" [ngModel]="fadeInCurve" (ngModelChange)="fadeInCurve = $event">
        @for (curveType of transitionCurveTypes; track curveType) {
        <option [value]="curveType">{{ 'designer.misc.transition-curve-' + curveType | translate }}</option>
        }
      </select>
    </div>
  </div>

  <div class="form-group row">
    <label class="col-lg-4 col-form-label"></label>
    <div class="col-lg-8 d-flex">
      <div class="form-check my-auto">
        <input type="checkbox" [ngModel]="fadeInPre" (ngModelChange)="fadeInPre = $event" class="form-check-input" id="fadeInPre" />

        <label class="form-check-label" for="fadeInPre">
          {{ 'designer.preset.settings-fade-in-pre' | translate }}
        </label>
      </div>
    </div>
  </div>

  <div class="form-group row">
    <label class="col-lg-4 col-form-label">{{ 'designer.preset.settings-fade-out' | translate }}</label>
    <div class="col-lg-7">
      <input type="text" class="form-control" [ngModel]="fadeOutMillis" (ngModelChange)="fadeOutMillis = $event" />
    </div>
    <div class="col-lg-1 d-flex p-0">
      <div class="my-auto">
        {{ 'designer.misc.ms' | translate }}
      </div>
    </div>
  </div>

  <div class="form-group row">
    <label class="col-lg-4 col-form-label">{{ 'designer.misc.transition-curve' | translate }}</label>
    <div class="col-lg-7">
      <select class="form-control" [ngModel]="fadeOutCurve" (ngModelChange)="fadeOutCurve = $event">
        @for (curveType of transitionCurveTypes; track curveType) {
        <option [value]="curveType">{{ 'designer.misc.transition-curve-' + curveType | translate }}</option>
        }
      </select>
    </div>
  </div>

  <div class="form-group row">
    <label class="col-lg-4 col-form-label"></label>
    <div class="col-lg-8 d-flex">
      <div class="form-check my-auto">
        <input type="checkbox" [ngModel]="fadeOutPost" (ngModelChange)="fadeOutPost = $event" class="form-check-input" id="fadeOutPost" />

        <label class="form-check-label" for="fadeOutPost">
          {{ 'designer.preset.settings-fade-out-post' | translate }}
        </label>
      </div>
    </div>
  </div>

  <!-- how the preset runs through its steps. Only worth showing once there is more than
       one of them: a single step is the static look the preset has always been. -->
  @if (preset.steps.length > 1) {
  <hr />

  <div class="form-group row">
    <label class="col-lg-4 col-form-label"></label>
    <div class="col-lg-8 d-flex">
      <div class="form-check my-auto">
        <input type="checkbox" [ngModel]="stepsLoop" (ngModelChange)="stepsLoop = $event" class="form-check-input" id="stepsLoop" />

        <label class="form-check-label" for="stepsLoop">
          {{ 'designer.preset.steps-loop' | translate }}
        </label>
      </div>
    </div>
  </div>

  <div class="form-group row">
    <label class="col-lg-4 col-form-label">{{ 'designer.preset.steps-loop-length' | translate }}</label>
    <div class="col-lg-7">
      <input
        type="text"
        class="form-control"
        placeholder="{{ automaticLoopMillis }}"
        [ngModel]="stepsLoopMillis"
        (ngModelChange)="stepsLoopMillis = $event"
      />
    </div>
    <div class="col-lg-1 d-flex p-0">
      <div class="my-auto">
        {{ 'designer.misc.ms' | translate }}
      </div>
    </div>
  </div>

  <div class="form-group row">
    <label class="col-lg-4 col-form-label">{{ 'designer.preset.steps-chase' | translate }}</label>
    <div class="col-lg-4">
      <input
        type="text"
        class="form-control"
        [ngModel]="stepsPhasingMode === 'spread' ? stepsPhasingCycles : stepsPhasingMillis"
        (ngModelChange)="setPhasingAmount($event)"
      />
    </div>
    <div class="col-lg-4">
      <select class="form-control" [ngModel]="stepsPhasingMode" (ngModelChange)="stepsPhasingMode = $event">
        <option [value]="'millis'">{{ 'designer.misc.ms' | translate }}</option>
        <option [value]="'spread'">{{ 'designer.effect.curve-chase-spread' | translate }}</option>
      </select>
    </div>
  </div>

  <div class="form-group row">
    <label class="col-lg-4 col-form-label">{{ 'designer.effect.curve-chase-group' | translate }}</label>
    <div class="col-lg-7">
      <input type="text" class="form-control" [ngModel]="stepsPhasingGroupSize" (ngModelChange)="stepsPhasingGroupSize = $event" />
    </div>
  </div>
  }
</div>
<div class="modal-footer">
  <a class="mr-3 my-auto" href="#" role="button" (click)="cancel(); (false)">
    {{ 'designer.misc.cancel' | translate }}
  </a>
  <button type="button" class="btn btn-primary" (click)="ok()">{{ 'designer.misc.ok' | translate }}</button>
</div>
