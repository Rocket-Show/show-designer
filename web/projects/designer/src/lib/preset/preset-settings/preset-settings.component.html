<div class="modal-header">
  <h4 class="modal-title pull-left">{{ name }}</h4>
  <button type="button" class="close pull-right" aria-label="Close" (click)="bsModalRef.hide()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="form-group row">
    <label class="col-lg-4 col-form-label">{{ 'designer.preset.settings-name' | translate }}</label>
    <div class="col-lg-7">
      <input type="text" class="form-control" [ngModel]="name" (ngModelChange)="name = $event" />
    </div>
  </div>

  <div class="form-group">
    <label class="d-block mb-2">{{ 'designer.misc.icon' | translate }}</label>
    <lib-app-icon-picker
      [icon]="icon"
      [defaultIcon]="defaultIcon"
      [color]="shownColor()"
      (iconChange)="icon = $event"
    ></lib-app-icon-picker>
  </div>

  <div class="form-group">
    <label class="d-block mb-2">{{ 'designer.misc.color' | translate }}</label>
    <lib-app-color-picker
      [color]="color"
      [auto]="colorAuto"
      [autoColor]="derivedColor"
      autoLabel="designer.preset.settings-color-auto"
      [palette]="palette"
      (colorChange)="color = $event"
      (autoChange)="colorAuto = $event"
    ></lib-app-color-picker>
  </div>

  <div class="form-group row">
    <label class="col-lg-4 col-form-label">{{ 'designer.preset.settings-start' | translate }}</label>
    <div class="col-lg-8 d-flex align-items-center">
      <input type="text" class="form-control sd-time-field" [ngModel]="startMillis" (ngModelChange)="startMillis = $event" />

      <div class="ml-2">
        {{ 'designer.misc.ms' | translate }}
      </div>
    </div>
  </div>

  <div class="form-group row">
    <label class="col-lg-4 col-form-label">{{ 'designer.preset.settings-end' | translate }}</label>
    <div class="col-lg-8 d-flex align-items-center">
      <input type="text" class="form-control sd-time-field" [ngModel]="endMillis" (ngModelChange)="endMillis = $event" />

      <div class="ml-2">
        {{ 'designer.misc.ms' | translate }}
      </div>
    </div>
  </div>

  <div class="form-group row">
    <label class="col-lg-4 col-form-label">{{ 'designer.preset.settings-fade-in' | translate }}</label>
    <div class="col-lg-8 d-flex align-items-center">
      <input type="text" class="form-control sd-time-field" [ngModel]="fadeInMillis" (ngModelChange)="fadeInMillis = $event" />

      <div class="ml-2">
        {{ 'designer.misc.ms' | translate }}
      </div>

      <select class="form-control sd-time-field ml-4" [ngModel]="fadeInCurve" (ngModelChange)="fadeInCurve = $event">
        @for (curveType of transitionCurveTypes; track curveType) {
        <option [value]="curveType">{{ 'designer.misc.transition-curve-' + curveType | translate }}</option>
        }
      </select>

      <div class="form-check ml-4">
        <input type="checkbox" [ngModel]="fadeInPre" (ngModelChange)="fadeInPre = $event" class="form-check-input" id="fadeInPre" />

        <label class="form-check-label" for="fadeInPre">
          {{ 'designer.preset.settings-fade-in-pre' | translate }}
        </label>
      </div>
    </div>
  </div>

  <div class="form-group row">
    <label class="col-lg-4 col-form-label">{{ 'designer.preset.settings-fade-out' | translate }}</label>
    <div class="col-lg-8 d-flex align-items-center">
      <input type="text" class="form-control sd-time-field" [ngModel]="fadeOutMillis" (ngModelChange)="fadeOutMillis = $event" />

      <div class="ml-2">
        {{ 'designer.misc.ms' | translate }}
      </div>

      <select class="form-control sd-time-field ml-4" [ngModel]="fadeOutCurve" (ngModelChange)="fadeOutCurve = $event">
        @for (curveType of transitionCurveTypes; track curveType) {
        <option [value]="curveType">{{ 'designer.misc.transition-curve-' + curveType | translate }}</option>
        }
      </select>

      <div class="form-check ml-4">
        <input type="checkbox" [ngModel]="fadeOutPost" (ngModelChange)="fadeOutPost = $event" class="form-check-input" id="fadeOutPost" />

        <label class="form-check-label" for="fadeOutPost">
          {{ 'designer.preset.settings-fade-out-post' | translate }}
        </label>
      </div>
    </div>
  </div>
</div>
<div class="modal-footer">
  <a class="mr-3 my-auto" href="#" role="button" (click)="cancel(); (false)">
    {{ 'designer.misc.cancel' | translate }}
  </a>
  <button type="button" class="btn btn-primary" (click)="ok()">{{ 'designer.misc.ok' | translate }}</button>
</div>
