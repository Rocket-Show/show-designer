<div class="card border-secondary panel h-100" [class.card-intro-active]="introService.showStep('scenes')">
  <div class="card-header d-flex">
    <div>
      {{ 'designer.scene.title' | translate }}
    </div>
    <div class="ml-auto">
      <a
        href="#"
        class="d-none d-md-inline-block btn btn-secondary m-0 p-0"
        [class.text-primary]="sceneService.multipleSelection == true"
        (click)="sceneService.multipleSelection = !sceneService.multipleSelection; (false)"
        ><i class="fa fa-object-group fa-fw" aria-hidden="true"></i
      ></a>
      <a href="#" class="d-none d-md-inline-block btn btn-secondary m-0 p-0" (click)="remove(); (false)"
        ><i class="fa fa-minus-circle fa-fw" aria-hidden="true"></i
      ></a>
      <a href="#" class="d-none d-md-inline-block btn btn-secondary m-0 p-0" (click)="sceneService.addScene(); (false)"
        ><i class="fa fa-plus-circle fa-fw" aria-hidden="true"></i
      ></a>
    </div>
  </div>
  <div class="card-body border-secondary p-0 overflow-auto">
    <!-- The scenes with their presets, ordered as they are layered in the scene -->
    <lib-tree
      [nodes]="treeNodes"
      [selectedNodes]="selectedNodes"
      [additiveSelection]="sceneService.multipleSelection"
      [allowDrop]="allowDrop"
      (selectedNodesChange)="onSelectedNodesChange($event)"
      (nodesChange)="onNodesChange($event)"
    >
      <ng-template #nodeTemplate let-node>
        @if (node.isFolder) {
        <div class="d-flex">
          <div class="my-auto text-truncate">
            {{ node.scene.name }}
          </div>
          <div class="my-auto ml-auto mr-2 d-flex">
            <svg class="my-auto" height="14" width="14">
              <circle cx="7" cy="7" r="6" stroke="rgba(255,255,255,0.45)" stroke-width="1" [attr.fill]="node.scene.color" />
            </svg>
          </div>
          <div class="d-none d-md-flex my-auto mr-2">
            <button
              type="button"
              class="btn btn-secondary btn-sm py-0 px-1"
              (click)="$event.stopPropagation(); openSettings(node.scene); (false)"
            >
              ...
            </button>
          </div>
        </div>
        } @else {
        <div class="text-truncate">
          {{ node.preset.name }}
        </div>
        }
      </ng-template>
    </lib-tree>
  </div>
</div>
