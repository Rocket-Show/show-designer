<div class="card border-secondary panel h-100" [class.card-intro-active]="introService.showStep('scenes')">
  <div class="card-header d-flex">
    <div>
      {{ 'designer.scene.title' | translate }}
    </div>
    <div class="ml-auto">
      <a
        href="#"
        class="d-none d-md-inline-block btn btn-secondary m-0 p-0"
        popover="{{ (allScenesCollapsed() ? 'designer.scene.expand-all' : 'designer.scene.collapse-all') | translate }}"
        container="body"
        placement="bottom"
        triggers="mouseenter:mouseleave"
        (click)="switchAllScenesCollapsed(); (false)"
        ><i class="fa fa-fw" [class.fa-compress]="!allScenesCollapsed()" [class.fa-expand]="allScenesCollapsed()" aria-hidden="true"></i
      ></a>
      <a
        href="#"
        class="d-none d-md-inline-block btn btn-secondary m-0 p-0"
        popover="{{ removeLabel() | translate }}"
        container="body"
        placement="bottom"
        triggers="mouseenter:mouseleave"
        (click)="remove(); (false)"
        ><i class="fa fa-trash-o fa-fw" aria-hidden="true"></i
      ></a>
      <a
        href="#"
        class="d-none d-md-inline-block btn btn-secondary m-0 p-0"
        popover="{{ 'designer.scene.add-folder' | translate }}"
        container="body"
        placement="bottom"
        triggers="mouseenter:mouseleave"
        (click)="addFolder(); (false)"
        ><i class="fa fa-folder-o fa-fw" aria-hidden="true"></i
      ></a>
      <a
        href="#"
        class="d-none d-md-inline-block btn btn-secondary m-0 p-0"
        popover="{{ 'designer.scene.add' | translate }}"
        container="body"
        placement="bottom"
        triggers="mouseenter:mouseleave"
        (click)="addScene(); (false)"
        ><i class="fa fa-plus fa-fw" aria-hidden="true"></i
      ></a>
    </div>
  </div>
  <div class="card-body border-secondary p-0 overflow-auto">
    <!-- The scenes, grouped in folders, with their presets ordered as they are layered
         in the scene -->
    <lib-tree
      [nodes]="treeNodes"
      [selectedNodes]="selectedNodes"
      [focusedNode]="focusedNode"
      [allowDrop]="allowDrop"
      (selectedNodesChange)="onSelectedNodesChange($event)"
      (nodesChange)="onNodesChange($event)"
      (nodeExpandedChange)="onNodeExpandedChange($event)"
      (activate)="onActivate($event)"
      (nodeDoubleClick)="onNodeDoubleClick($event)"
    >
      <ng-template #nodeTemplate let-node>
        @if (node.sceneFolder) {
        <div class="d-flex">
          <div class="my-auto text-truncate" (click)="$event.stopPropagation()">
            <lib-app-inline-edit [value]="node.sceneFolder.name" (valueChange)="node.sceneFolder.name = $event"></lib-app-inline-edit>
          </div>
        </div>
        } @else if (node.isFolder) {
        <div class="d-flex">
          <div class="my-auto text-truncate mr-auto">
            {{ node.scene.name }}
          </div>
          <!-- a scene which is held below full says so, so a dimmed one does not just
               look like it is not working -->
          @if (node.scene.dimmer < 1) {
          <div class="my-auto pl-2 scene-dimmer">{{ dimmerPercentage(node.scene) }}%</div>
          }
          <div class="d-none d-md-flex my-auto ml-2 mr-2">
            <button
              type="button"
              class="btn btn-secondary btn-sm py-0 px-1"
              (click)="$event.stopPropagation(); openSettings(node.scene); (false)"
            >
              ...
            </button>
          </div>
        </div>
        } @else {
        <div class="text-truncate">
          {{ node.preset.name }}
        </div>
        }
      </ng-template>
    </lib-tree>
  </div>
</div>
