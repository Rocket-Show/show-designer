<div class="card border-secondary panel h-100">
  <div class="card-body capability-container d-flex h-100" style="overflow-y: hidden">
    <!-- h-100 needs to be applied in chrome to avoid performance issues with many layouts (reflows)
      during sliding. But the class must not be applied e.g. in Safari, because the bottom margin is not correct
      anymore afterwards. -->
    <div class="row m-0 pl-3" [class.h-100]="isChrome()">
      <!-- Position -->
      <div class="col col-auto p-0 my-3 mr-3">
        <lib-app-fixture-settings-position></lib-app-fixture-settings-position>
      </div>

      <!-- Stage -->
      <div class="col col-auto p-0 my-3 mr-3">
        <lib-app-fixture-settings-stage></lib-app-fixture-settings-stage>
      </div>

      <!-- Dimmers: whether a color alone lights a fixture lighting in colors (see Project.colorDimmersAtFull) -->
      <div class="col col-auto p-0 my-3 mr-3">
        <div class="card border-secondary h-100 color-dimmers">
          <div class="card-header">
            {{ 'designer.fixture.setting-dimmers' | translate }}
          </div>
          <div class="card-body">
            <div class="form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="color-dimmers-at-full"
                [ngModel]="projectService.project.colorDimmersAtFull"
                (ngModelChange)="setColorDimmersAtFull($event)"
              />
              <label class="form-check-label" for="color-dimmers-at-full">{{
                'designer.fixture.setting-color-dimmers-at-full' | translate
              }}</label>
            </div>
            <div class="text-muted color-dimmers-hint">{{ 'designer.fixture.setting-color-dimmers-at-full-hint' | translate }}</div>
          </div>
        </div>
      </div>

      <!-- Fix spacing at the end -->
      <div class="col col-auto p-0 my-3 mr-3">&nbsp;</div>
    </div>
  </div>
</div>
