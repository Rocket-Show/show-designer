<div class="card border-secondary h-100 panel" [class.card-intro-active]="introService.showStep('fixtures')">
  <div class="card-header d-flex">
    <div>Fixtures</div>
    <div class="ml-auto">
      @if (presetService.selectedPreset && !fixtureService.settingsSelection) {
      <a
        href="#"
        class="btn btn-secondary m-0 p-0"
        [class.text-primary]="usePresetOrder()"
        popover="{{ 'designer.fixture.custom-order' | translate }}"
        container="body"
        placement="bottom"
        triggers="mouseenter:mouseleave"
        (click)="switchCustomFixtureOrder(!usePresetOrder()); (false)"
        ><i class="fa fa-list-ol fa-fw" aria-hidden="true"></i
      ></a>
      }
      <a
        href="#"
        class="btn btn-secondary m-0 p-0"
        popover="{{ 'designer.fixture.select-none' | translate }}"
        container="body"
        placement="bottom"
        triggers="mouseenter:mouseleave"
        (click)="selectNone(); (false)"
        ><i class="fa fa-square-o fa-fw" aria-hidden="true"></i
      ></a>
      <a
        href="#"
        class="btn btn-secondary m-0 p-0"
        popover="{{ 'designer.fixture.select-all' | translate }}"
        container="body"
        placement="bottom"
        triggers="mouseenter:mouseleave"
        (click)="selectAll(); (false)"
        ><i class="fa fa-check-square-o fa-fw" aria-hidden="true"></i
      ></a>
      <a
        href="#"
        class="btn btn-secondary m-0 p-0"
        popover="{{ (allFoldersCollapsed() ? 'designer.fixture.expand-all' : 'designer.fixture.collapse-all') | translate }}"
        container="body"
        placement="bottom"
        triggers="mouseenter:mouseleave"
        (click)="switchAllFoldersCollapsed(); (false)"
        ><i class="fa fa-fw" [class.fa-compress]="!allFoldersCollapsed()" [class.fa-expand]="allFoldersCollapsed()" aria-hidden="true"></i
      ></a>
      <a
        href="#"
        class="btn btn-secondary m-0 p-0"
        popover="{{ 'designer.fixture.remove-folder' | translate }}"
        container="body"
        placement="bottom"
        triggers="mouseenter:mouseleave"
        (click)="removeFolder(); (false)"
        ><i class="fa fa-trash-o fa-fw" aria-hidden="true"></i
      ></a>
      <a
        href="#"
        class="btn btn-secondary m-0 p-0"
        popover="{{ 'designer.fixture.add-folder' | translate }}"
        container="body"
        placement="bottom"
        triggers="mouseenter:mouseleave"
        (click)="addFolder(); (false)"
        ><i class="fa fa-folder-o fa-fw" aria-hidden="true"></i
      ></a>
      <a
        href="#"
        class="btn btn-secondary m-0 p-0"
        popover="{{ 'designer.navigation.fixture-pool' | translate }}"
        container="body"
        placement="bottom"
        triggers="mouseenter:mouseleave"
        (click)="openFixturePool(); (false)"
        ><i class="fa fa-cog fa-fw" aria-hidden="true"></i
      ></a>
    </div>
  </div>

  <div class="card-body h-100 p-0 overflow-auto">
    <!-- All fixtures of the project, grouped in folders. Their order is the one the
         presets chase them in; a preset bringing its own order moves the folders and its
         own fixtures inside them, the fixtures it does not chase come last in a folder -->
    <lib-tree
      [nodes]="treeNodes"
      [selectedNodes]="selectedNodes"
      [focusedNode]="focusedNode"
      [plainClickSelects]="false"
      [nodeClass]="nodeClass"
      [allowDrag]="allowDrag"
      [allowDrop]="allowDrop"
      (selectedNodesChange)="onSelectedNodesChange($event)"
      (nodesChange)="onNodesChange($event)"
      (nodeExpandedChange)="onNodeExpandedChange($event)"
      (activate)="onActivate($event)"
    >
      <ng-template #nodeTemplate let-node>
        @if (node.folder) {
        <div class="d-flex">
          <div class="my-auto text-truncate" (click)="$event.stopPropagation()">
            <lib-app-inline-edit [value]="node.folder.name" (valueChange)="node.folder.name = $event"></lib-app-inline-edit>
          </div>
        </div>
        } @else {
        <div class="d-flex">
          <div class="form-check my-auto mr-1">
            <input
              type="checkbox"
              class="form-check-input"
              [ngModel]="fixtureIsSelected(node.presetFixture)"
              (ngModelChange)="selectFixture(node.presetFixture)"
              (click)="$event.stopPropagation()"
            />
          </div>
          <div class="my-auto text-truncate">
            {{ fixtureName(node.presetFixture) }}
          </div>
        </div>
        }
      </ng-template>
    </lib-tree>
    @if (projectService.project.presetFixtures.length == 0) {
    <div class="w-100 h-100 d-flex p-3 text-center">
      <a href="#" class="m-auto" (click)="openFixturePool(); (false)"
        ><i class="fa fa-plus-circle fa-fw" aria-hidden="true"></i> {{ 'designer.fixture.no-fixtures' | translate }}</a
      >
    </div>
    }
  </div>
</div>
