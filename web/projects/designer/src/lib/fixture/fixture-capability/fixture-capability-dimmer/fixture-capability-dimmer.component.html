<div class="card border-secondary h-100" [class.capability-deactivated]="getValue() == undefined" style="min-height: 200px">
  <div class="card-header">
    <div class="my-auto">
      <div class="form-check">
        <input
          type="checkbox"
          class="form-check-input"
          id="capabilityDimmerActive"
          [ngModel]="getValue() != undefined"
          (ngModelChange)="changeActive($event)"
        />
        <label class="form-check-label" for="capabilityDimmerActive">
          <i class="icon-dimmer"></i>
        </label>
      </div>
    </div>
    <!-- fanned out over the fixtures of the preset -->
    <button
      type="button"
      class="btn btn-secondary btn-sm fan-toggle"
      name="fan"
      [class.active]="isFanned()"
      [attr.aria-pressed]="isFanned()"
      [title]="'designer.fixture.fan-hint' | translate"
      [attr.aria-label]="'designer.fixture.fan' | translate"
      (click)="toggleFan()"
    >
      <i class="fa fa-signal" aria-hidden="true"></i>
    </button>
  </div>

  @if (isFanned()) {
  <div class="card-body h-100 d-flex" style="flex-direction: column">
    <lib-app-fixture-capability-fan [types]="types"></lib-app-fixture-capability-fan>
  </div>
  } @else {
  <div class="card-body h-100 d-flex" style="flex-direction: column">
    <div class="mb-4 w-100 d-flex">
      <input
        class="mx-auto sd-value-input"
        type="text"
        [ngModel]="getValueText() >= 0 ? getValueText() : 0"
        (ngModelChange)="setValue($event / 100)"
      />
    </div>

    <div class="h-100 w-100 d-flex">
      <mv-slider
        class="mx-auto"
        [value]="getValue() >= 0 ? getValue() : 0"
        (change)="setValue($event.newValue)"
        [orientation]="'vertical'"
        [reversed]="true"
        style="height: 100%"
        [tooltip]="'hide'"
        [min]="0"
        [max]="1"
        [step]="0.001"
      ></mv-slider>
    </div>
  </div>
  }
</div>
