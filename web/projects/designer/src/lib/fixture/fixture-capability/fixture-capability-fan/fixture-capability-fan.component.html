<!-- the two ends of the fan, each on a slider of its own: the first and the last fixture, or the middle and the ends -->
<div class="fan-ends h-100">
  @for (end of ['from', 'to']; track end) {
  <div class="fan-end">
    <div class="fan-end-label text-muted">{{ 'designer.fixture.fan-' + shape + '-' + end | translate }}</div>
    <input
      class="mx-auto sd-value-input fan-value"
      type="text"
      [attr.name]="'fan-' + end"
      [attr.aria-label]="'designer.fixture.fan-' + shape + '-' + end | translate"
      [ngModel]="getText($any(end))"
      (ngModelChange)="setEnd($any(end), $event / 100)"
    />
    @if (highKey) {
    <div class="position-end text-muted text-center">{{ highKey | translate }}</div>
    }
    <div class="fan-slider d-flex">
      <mv-slider
        class="mx-auto"
        [value]="fan[end]"
        (change)="setEnd($any(end), $event.newValue)"
        [orientation]="'vertical'"
        [reversed]="true"
        style="height: 100%"
        [tooltip]="'hide'"
        [min]="0"
        [max]="1"
        [step]="0.001"
      ></mv-slider>
    </div>
    @if (lowKey) {
    <div class="position-end text-muted text-center">{{ lowKey | translate }}</div>
    }
  </div>
  }
</div>

<!-- what each fixture gets, in the order of the fan -->
<div class="fan-bars" [title]="'designer.fixture.fan-bars-hint' | translate">
  @for (bar of bars; track $index) {
  <div class="fan-bar"><div class="fan-bar-value" [style.height.%]="bar * 100"></div></div>
  }
</div>

<!-- from the first to the last fixture, or from the middle out to both ends -->
<div class="btn-group btn-group-sm fan-shapes mx-auto" role="group" [attr.aria-label]="'designer.fixture.fan-shape' | translate">
  @for (fanShape of ['linear', 'center']; track fanShape) {
  <button
    type="button"
    class="btn btn-secondary"
    [attr.name]="'fan-shape-' + fanShape"
    [class.active]="shape === fanShape"
    [title]="'designer.fixture.fan-shape-' + fanShape | translate"
    [attr.aria-label]="'designer.fixture.fan-shape-' + fanShape | translate"
    (click)="setShape($any(fanShape))"
  >
    <span class="fan-shape-icon fan-shape-icon-{{ fanShape }}" aria-hidden="true"></span>
  </button>
  }
</div>
