<div class="card border-secondary h-100" [class.capability-deactivated]="!isActive()" style="min-height: 200px">
  <div class="card-header">
    <div class="my-auto">
      <div class="form-check">
        <input type="checkbox" class="form-check-input" [id]="id" [ngModel]="isActive()" (ngModelChange)="changeActive($event)" />
        <label class="form-check-label text-nowrap" [for]="id">
          @if (isEmitter) {
          <span class="emitter-swatch mr-1" [style.background-color]="emitterColor"></span>
          }
          {{ labelKey | translate }}
        </label>
      </div>
    </div>
    <!-- fanned out over the fixtures of the preset -->
    @if (!isSwitch) {
    <button
      type="button"
      class="btn btn-secondary btn-sm fan-toggle"
      name="fan"
      [class.active]="isFanned()"
      [attr.aria-pressed]="isFanned()"
      [title]="'designer.fixture.fan-hint' | translate"
      [attr.aria-label]="'designer.fixture.fan' | translate"
      (click)="toggleFan()"
    >
      <i class="fa fa-signal" aria-hidden="true"></i>
    </button>
    }
  </div>

  <!-- the effect the strobe flashes in, on every model as far as it can -->
  @if (isStrobe) {
  <div class="strobe-effect px-2 pt-2">
    <select
      class="w-100"
      name="strobeEffect"
      [attr.aria-label]="'designer.fixture.strobe-effect' | translate"
      [title]="'designer.fixture.strobe-effect-hint' | translate"
      [ngModel]="getStrobeEffect()"
      (ngModelChange)="setStrobeEffect($event)"
    >
      @for (effect of strobeEffects; track effect) {
      <option [value]="effect">{{ 'designer.fixture.strobe-effect-' + effect | translate }}</option>
      }
    </select>
  </div>
  } @if (isSwitch) {
  <div class="card-body h-100 d-flex" style="flex-direction: column">
    <div class="btn-group-vertical btn-group-toggle mx-auto" role="group">
      <button type="button" class="btn btn-secondary btn-sm" [class.active]="getValue() > 0" (click)="setValue(1)">
        {{ highKey | translate }}
      </button>
      <button type="button" class="btn btn-secondary btn-sm" [class.active]="getValue() === 0" (click)="setValue(0)">
        {{ lowKey | translate }}
      </button>
    </div>
  </div>
  } @else if (isFanned()) {
  <div class="card-body h-100 d-flex" style="flex-direction: column">
    <lib-app-fixture-capability-fan
      [types]="types"
      [color]="color"
      [blade]="blade"
      [lowKey]="lowKey"
      [highKey]="highKey"
    ></lib-app-fixture-capability-fan>
  </div>
  } @else {
  <div class="card-body h-100 d-flex" style="flex-direction: column">
    <div class="mb-2 w-100 d-flex">
      <input
        class="mx-auto sd-value-input"
        type="text"
        [ngModel]="getValueText() >= 0 ? getValueText() : 0"
        (ngModelChange)="setValue($event / 100)"
      />
    </div>

    <div class="position-end text-muted text-center">{{ highKey | translate }}</div>

    <div class="h-100 w-100 d-flex">
      <mv-slider
        class="mx-auto"
        [value]="getValue() >= 0 ? getValue() : 0"
        (change)="setValue($event.newValue)"
        [orientation]="'vertical'"
        [reversed]="true"
        style="height: 100%"
        [tooltip]="'hide'"
        [min]="0"
        [max]="1"
        [step]="0.001"
      ></mv-slider>
    </div>

    <div class="position-end text-muted text-center">{{ lowKey | translate }}</div>
  </div>
  }
</div>
