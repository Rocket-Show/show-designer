<div class="card border-secondary h-100" [class.capability-deactivated]="!active">
  <div class="card-header">
    <div class="my-auto" style="float: left">
      <div class="form-check">
        <input
          type="checkbox"
          class="form-check-input"
          id="capabilityColorActive"
          [ngModel]="active"
          (ngModelChange)="changeActive($event)"
        />
        <label class="form-check-label" for="capabilityColorActive">{{ 'designer.fixture.capability-color' | translate }}</label>
      </div>
    </div>
    <div class="pull-right">
      <input type="text" [(ngModel)]="color" class="sd-value-input sd-value-input-hex" />
    </div>
  </div>

  <div class="card-body h-100">
    <div id="color-picker-container"></div>
  </div>
</div>
