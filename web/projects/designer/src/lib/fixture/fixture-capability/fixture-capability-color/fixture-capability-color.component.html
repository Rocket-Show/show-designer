<div class="card border-secondary h-100" [class.capability-deactivated]="!active">
  <div class="card-header">
    <div class="my-auto" style="float: left">
      <div class="form-check">
        <input
          type="checkbox"
          class="form-check-input"
          id="capabilityColorActive"
          [ngModel]="active"
          (ngModelChange)="changeActive($event)"
        />
        <label class="form-check-label" for="capabilityColorActive">{{ 'designer.fixture.capability-color' | translate }}</label>
      </div>
    </div>
    <div class="pull-right d-flex align-items-center">
      <!-- a gradient of colors spanned over the fixtures of the preset, or one color for all of them -->
      <button
        type="button"
        class="btn btn-secondary btn-sm gradient-toggle"
        name="gradient"
        [class.active]="gradient"
        [attr.aria-pressed]="gradient"
        [title]="'designer.fixture.capability-color-gradient-hint' | translate"
        [attr.aria-label]="'designer.fixture.capability-color-gradient' | translate"
        (click)="toggleGradient()"
      >
        <span class="gradient-toggle-swatch" aria-hidden="true"></span>
      </button>
      @if (!gradient) {
      <input type="text" [ngModel]="color" (ngModelChange)="typeColor($event)" class="sd-value-input sd-value-input-hex ml-2" />
      }
    </div>
  </div>

  <div class="card-body h-100">
    <div id="color-picker-container" [hidden]="gradient"></div>
    <!-- the white part of the colors on the white LEDs of the fixtures having them (belongs to the whole preset) -->
    @if (hasWhite()) {
    <div class="form-check mt-2" [title]="'designer.fixture.capability-color-white-hint' | translate">
      <input
        type="checkbox"
        class="form-check-input"
        id="capabilityColorWhite"
        name="whiteFromColor"
        [ngModel]="getWhiteFromColor()"
        (ngModelChange)="setWhiteFromColor($event)"
      />
      <label class="form-check-label" for="capabilityColorWhite">{{ 'designer.fixture.capability-color-white' | translate }}</label>
    </div>
    } @if (gradient) {
    <div class="color-gradient">
      <lib-app-gradient-editor [stops]="gradientStops" (stopsChange)="setGradient($event)"></lib-app-gradient-editor>
      <div class="color-gradient-hint text-muted mt-2">{{ 'designer.fixture.capability-color-gradient-order' | translate }}</div>
    </div>
    }
  </div>
</div>
