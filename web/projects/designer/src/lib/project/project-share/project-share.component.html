<div class="modal-header">
  <h4 class="modal-title pull-left">{{ 'designer.project.share-title' | translate }}</h4>
  <button type="button" class="close pull-right" aria-label="Close" (click)="bsModalRef.hide()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="form-group row">
    <label class="col-lg-4 col-form-label">{{ 'designer.project.share-link' | translate }}</label>
    <div class="col-lg-8 d-flex">
      <input type="text" class="form-control" [ngModel]="shareLink" readonly />
    </div>
  </div>

  <!-- sharing a show is a good moment to mention where it can be played for real -->
  @if (hardwarePromoService.enabled) {
  <div class="hardware-promo-hint">
    <i class="fa fa-lightbulb-o" aria-hidden="true"></i>
    <span>
      {{ 'designer.hardware-promo.share-hint' | translate }}
      <a [href]="promoLink" target="_blank" rel="noopener">{{ 'designer.hardware-promo.cta' | translate }}</a>
    </span>
  </div>
  }
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-primary" (click)="ok()">{{ 'designer.misc.ok' | translate }}</button>
</div>
