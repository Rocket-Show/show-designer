name: Mutation testing

# How many of the faults put into the engine of the designer (the code Rocket Show plays the projects with as well)
# its specs notice: Stryker, see web/stryker.config.mjs. It takes about two hours, so it runs once a week and on demand.
on:
  schedule:
    - cron: "43 2 * * 1"
  workflow_dispatch:

jobs:
  engine:
    name: Mutation testing of the engine
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Run the mutation tests
        run: npm run mutation -- --concurrency 4
      - name: Summarize the mutation score
        if: always()
        run: |
          if [ -f reports/mutation/mutation.json ]; then
            node -e '
              const files = require("./reports/mutation/mutation.json").files;
              const mutants = Object.values(files).flatMap((file) => file.mutants);
              const killed = mutants.filter((mutant) => ["Killed", "Timeout"].includes(mutant.status)).length;
              const valid = mutants.filter((mutant) => !["CompileError", "RuntimeError", "Ignored"].includes(mutant.status)).length;
              console.log(`Mutants killed by the specs: ${killed} of ${valid} (${(100 * killed / valid).toFixed(1)} %)`);
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: web/reports/mutation
          retention-days: 30
